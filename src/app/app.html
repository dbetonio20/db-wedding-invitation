<app-envelope-landing (revealed)="onEnvelopeRevealed()" />

<div class="site-wrapper" [class.site-wrapper--visible]="siteRevealed()">

<a class="skip-link visually-hidden" href="#main-content">Skip to main content</a>

<app-navigation />

<main id="main-content">
  <!-- Hero: sticky prenup background with overlay text -->
  <app-hero />

  <!-- Photo panel 1 → revealed as Our Story scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-1.jpg"
    alt="Dominique and Bianca prenup photo — Our Story"
    caption="Where it all began…"
  />
  <app-our-story />

  <!-- Photo panel 2 → revealed as Countdown scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-2.jpg"
    alt="Dominique and Bianca prenup photo — Our Journey"
    caption="Every moment led us here"
  />
  <app-countdown />

  <!-- Photo panel 3 → revealed as Invitation scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-3.jpg"
    alt="Dominique and Bianca prenup photo — Together"
    caption="Two hearts, one love"
  />
  <app-invitation />

  <!-- Photo panel 4 → revealed as Gallery scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-4.jpg"
    alt="Dominique and Bianca prenup photo — Forever"
    caption="A love worth celebrating"
  />
  <app-gallery />

  <!-- Photo panel 5 → revealed as Wedding Details scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-5.jpg"
    alt="Dominique and Bianca prenup photo — The Details"
    caption="Every detail, crafted with love"
  />
  <app-wedding-details />

  <!-- Photo panel 6 → revealed as Venue/RSVP scrolls away -->
  <app-photo-panel
    src="images/prenup/prenup-6.jpg"
    alt="Dominique and Bianca prenup photo — The Day"
    caption="See you at the celebration"
  />
  <app-venue />
  <app-rsvp />
</main>

<app-footer />

<!-- ── Floating audio toggle (persistent across whole site) ── -->
@if (siteRevealed()) {
  <button
    class="audio-fab"
    type="button"
    (click)="audioService.toggle()"
    [attr.aria-label]="audioService.enabled() ? 'Mute ambient music (Tahanan)' : 'Play ambient music (Tahanan)'"
    [attr.title]="audioService.enabled() ? 'Mute music (Tahanan)' : 'Play ambient music (Tahanan)'"
    [attr.aria-pressed]="audioService.enabled()"
    [class.audio-fab--playing]="audioService.enabled()"
  >
    @if (audioService.enabled()) {
      <span class="audio-fab__equalizer" aria-hidden="true">
        <span class="audio-fab__bar"></span>
        <span class="audio-fab__bar"></span>
        <span class="audio-fab__bar"></span>
      </span>
      <svg class="audio-fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18" aria-hidden="true">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke-linecap="round"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke-linecap="round"/>
      </svg>
    } @else {
      <svg class="audio-fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20" aria-hidden="true">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
        <line x1="23" y1="9" x2="17" y2="15" stroke-linecap="round"/>
        <line x1="17" y1="9" x2="23" y2="15" stroke-linecap="round"/>
      </svg>
    }
  </button>
}

</div><!-- /site-wrapper -->
