<section id="venue" class="section venue" aria-labelledby="venue-title">
  <div class="container">
    <h2 id="venue-title" class="section-title">The Venue</h2>
    <p class="venue__name script-font">Chateau de Busay</p>
    <p class="venue__tagline">Nestled in the hills of Cebu, where elegance meets nature</p>

    <div class="venue__map-wrapper">
      @if (isBrowser()) {
        <iframe
          class="venue__map"
          title="Chateau de Busay location map"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3925.2!2d123.8895!3d10.3475!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x33a999e1c3f1c9c7%3A0x92a4f5e0f3e5a9c8!2sChateau%20de%20Busay!5e0!3m2!1sen!2sph!4v1700000000000"
          width="100%"
          height="100%"
          style="border:0"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      } @else {
        <div class="venue__map-placeholder" aria-label="Map showing venue location">
          <span aria-hidden="true">🗺️</span>
          <p>Loading map…</p>
        </div>
      }
    </div>

    <div class="venue__info">
      <div class="venue__info-grid">
        <div class="venue__info-item">
          <svg class="venue__info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <div>
            <span class="venue__info-label">Address</span>
            <p class="venue__address">Chateau de Busay, Busay Hills,<br>Cebu City, Philippines 6000</p>
          </div>
        </div>

        <div class="venue__info-item">
          <svg class="venue__info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <div>
            <span class="venue__info-label">Date &amp; Time</span>
            <p class="venue__address">January 25, 2027<br>4:00 in the afternoon</p>
          </div>
        </div>
      </div>

      <a
        class="venue__directions"
        href="https://maps.google.com/?q=Chateau+de+Busay+Cebu"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" aria-hidden="true">
          <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        Get Directions
      </a>
    </div>
  </div>
</section>
