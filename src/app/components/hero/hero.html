<section
  id="hero"
  class="hero"
  [style.background-image]="'linear-gradient(180deg, rgba(253, 248, 244, 0.3) 0%, rgba(0, 0, 0, 0.15) 100%), url(' + backgroundImage() + ')'"
  aria-label="Wedding introduction"
>
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <p class="hero__tagline script-font">We're Getting Married</p>
    <h1 class="hero__names display-font">
      Dominique <span class="hero__ampersand script-font">&amp;</span> Bianca
    </h1>
    <p class="hero__date">January 25, 2027 · Cebu</p>
  </div>
  <a
    class="hero__scroll-cue"
    href="#our-story"
    aria-label="Scroll to Our Story section"
  >
    <span class="hero__scroll-chevron" aria-hidden="true">&#8964;</span>
  </a>
</section>
